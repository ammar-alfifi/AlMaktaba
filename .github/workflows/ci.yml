# Continuous integration for MyLibrary.
#
# The unit suite is the regression gate: it is the only thing that runs on every push, and it is
# deliberately the whole of it — `./gradlew test` covers every module, including the Robolectric
# tests that build the real Hilt graph and launch MainActivity. It is the check that caught the
# launch crash described in the README, and it must never be skipped for speed.
#
# What this workflow does *not* do yet is run the app on an emulator. The gestures and the reader's
# composition lifetime are the part of this codebase that unit tests provably cannot cover (see
# "The reader's gestures are the part of this app least covered by tests" in the README), and a
# second job running instrumented Compose tests on an AVD is the natural next step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch or PR has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fails the run if the committed wrapper jar does not match gradle-wrapper.properties, so a
      # tampered wrapper cannot execute in CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs cmdline-tools, accepts the SDK licences, and installs the one platform the build
      # needs. `compileSdk = 37` is not optional here: io.legere:pdfiumandroid publishes a minimum
      # compileSdk of 37, so a runner with an older platform cannot compile :format:format-pdf at
      # all. AGP downloads the matching build-tools itself once the licences are accepted.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every unit test in every module. This is the gate.
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # Compiling the tests is not the same as packaging the app: this catches resource, manifest
      # and native-library packaging faults that the test task never links.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Lint is reported, not enforced: the convention plugin sets `abortOnError = false`, so this
      # surfaces new findings in the log without failing a run over a style warning. Tightening it
      # (a baseline, then `abortOnError = true`) is a deliberate follow-up, not an accident.
      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Producing a *signed* APK is deliberately a manual job, and separate from the gate above: the
  # test job must never depend on secret material being present, or a contributor's pull request
  # could not be checked. Run this from the Actions tab (workflow_dispatch) when a release is wanted.
  #
  # It needs four repository secrets, none of which is committed:
  #   KEYSTORE_BASE64    the keystore file, base64-encoded (`base64 -w0 release.jks`)
  #   KEYSTORE_PASSWORD  its store password
  #   KEY_ALIAS          the key's alias
  #   KEY_PASSWORD       the key's password
  # Losing this keystore means no existing user can ever receive an update, which is why it is worth
  # keeping off a single machine. See "Release signing" in the README.
  release:
    name: Signed release build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. This job needs KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble the signed release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: mylibrary-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
