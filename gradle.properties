# JVM arguments for the Gradle daemon.
#
# The locale is pinned to US English deliberately, and it is not cosmetic. This machine's default
# locale is Arabic, and annotation processors that format numbers with the default locale emit
# Arabic-Indic digits (١٢٣). Room's generated `RoomOpenDelegate(<schemaVersion>, …)` then contains
# `١` where Kotlin requires `1`, and the module fails to compile with a syntax error pointing at
# generated code you never wrote. Pinning the *build* locale keeps generated sources ASCII while
# leaving the app's own locale behaviour — which is driven by resources and the in-app language
# setting — completely unaffected.
#
# It is set on both JVMs because the processor does not always run where you expect: with the
# in-process strategy it runs in the Gradle daemon, and otherwise in the Kotlin daemon.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
kotlin.daemon.jvmargs=-Duser.language=en -Duser.country=US

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# The configuration cache skips re-running the configuration phase on a repeat build. It is safe
# here because nothing in the build reads the environment at configuration time in a way that would
# change between runs; the one global — `Locale.setDefault` in settings.gradle.kts — is a constant.
org.gradle.configuration-cache=true

# Kotlin source formatting is enforced by the official style guide.
kotlin.code.style=official

# Run the Kotlin compiler inside the Gradle daemon. The out-of-process Kotlin daemon cannot
# establish its socket in this sandbox, and every compilation task otherwise spends ~20s retrying
# the connection before falling back to this same strategy anyway.
kotlin.compiler.execution.strategy=in-process

# AGP 9 enables its built-in Kotlin integration and the new DSL by default; both are relied upon
# throughout this build, so they are pinned here explicitly rather than left implicit.
android.builtInKotlin=true
android.newDsl=true
